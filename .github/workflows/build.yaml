name: Build

on:
  workflow_call:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node modules
        working-directory: ui
        run: npm install

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Copy JSON files
        run: |
          jq -c . < ui/live.json > /tmp/live.json
          cp /tmp/live.json ui/dist
          jq -c . < ui/demo.json > /tmp/demo.json
          cp /tmp/demo.json ui/dist
          jq -c . < ui/2025.json > /tmp/2025.json
          cp /tmp/2025.json ui/dist
          cp -r ui/imgs ui/dist/imgs

      - name: Copy admin UI
        run: |
          mkdir -p ui/dist/admin
          cp admin/index* ui/dist/admin/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: ui/dist
