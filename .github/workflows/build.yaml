name: Build

on:
  workflow_call:

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: "ui/.nvmrc"

      - name: Install Node modules
        working-directory: ui
        run: npm ci

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Copy JSON files
        run: |
          jq -c . < ui/live.json > /tmp/live.json
          cp /tmp/live.json ui/dist
          jq -c . < ui/demo.json > /tmp/demo.json
          cp /tmp/demo.json ui/dist
          jq -c . < ui/2025.json > /tmp/2025.json
          cp /tmp/2025.json ui/dist
          cp -r ui/imgs ui/dist/imgs

      - name: Copy admin UI
        run: |
          mkdir -p ui/dist/admin
          cp admin/index* ui/dist/admin/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ui/dist
          retention-days: 1
