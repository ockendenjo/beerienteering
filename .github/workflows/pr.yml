name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: $/.github/workflows/validate.yaml

  build:
    uses: $/.github/workflows/build.yaml

  ui-check:
    name: UI
    permissions:
      contents: read # 2026-09-23
    uses: ockendenjo/actions/.github/workflows/ui-lint.yml@b0484bc934491a439496a0c92e64820e9b5f7638 # zizmor: ignore[stale-action-refs,ref-version-mismatch]
    with:
      working_dir: ui
